name: Dev build

# Every push to the dev branch replaces the "dev" pre-release with a fresh zip and
# latest.json. Kindles on the Dev channel see it the next time Home or Settings
# opens with Wi-Fi on.
on:
  push:
    branches: [dev]

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check lua-filesystem
      - name: Lint
        run: luacheck minimalhome.koplugin
      - name: Get KOReader (for the smoke tests)
        run: git clone --depth 1 https://github.com/koreader/koreader ../koreader
      - name: Tests
        run: sh tools/test.sh ../koreader

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: sh tools/package.sh --no-bump --channel dev
      - name: Update the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        # Never delete the release: a Kindle may be downloading from it right now.
        # The zip goes up first, latest.json last; the three newest zips are kept, so
        # a Kindle that read an older latest.json can still finish its download.
        run: |
          VERSION="$(sed -n 's/.*version = "\(.*\)".*/\1/p' minimalhome.koplugin/_meta.lua)"
          NOTES="Test build $VERSION from the dev branch (${GITHUB_SHA::7}). Not an official release. Kindles on the Dev channel offer it in Settings."
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev "dist/minimalhome-$VERSION.zip" --clobber
            gh release upload dev dist/latest.json --clobber
            git tag -f dev "$GITHUB_SHA"
            git push -f origin refs/tags/dev
            gh release edit dev --title "Dev build $VERSION" --notes "$NOTES" --prerelease
          else
            gh release create dev "dist/minimalhome-$VERSION.zip" dist/latest.json \
              --prerelease --target "$GITHUB_SHA" --title "Dev build $VERSION" --notes "$NOTES"
          fi
          gh release view dev --json assets --jq '.assets[].name' | grep '^minimalhome-.*\.zip$' \
            | sort -V | head -n -3 | while read -r old; do gh release delete-asset dev "$old" --yes; done
