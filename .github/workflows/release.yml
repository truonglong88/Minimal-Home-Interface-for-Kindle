name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check lua-filesystem
      - name: Lint
        run: luacheck minimalhome.koplugin
      - name: Get KOReader (for the smoke tests)
        run: git clone --depth 1 https://github.com/koreader/koreader ../koreader
      - name: Tests
        run: sh tools/test.sh ../koreader

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: sh tools/package.sh --no-bump
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
