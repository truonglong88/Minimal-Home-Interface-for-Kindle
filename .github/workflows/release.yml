name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # a release created on GitHub (Releases → Draft a new release) builds its zip too
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check lua-filesystem
      - name: Lint
        run: luacheck minimalhome.koplugin
      - name: Get KOReader (for the smoke tests)
        run: git clone --depth 1 https://github.com/koreader/koreader ../koreader
      - name: Tests
        run: sh tools/test.sh ../koreader

  release:
    # A push to main whose version has no release yet publishes one (notes from
    # CHANGELOG.md). A release made by hand on GitHub, or a v* tag, gets its zip too.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: sh tools/package.sh --no-bump --channel stable
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(sed -n 's/.*version = "\(.*\)".*/\1/p' minimalhome.koplugin/_meta.lua)"
          TAG="${RELEASE_TAG:-v$VERSION}"
          case "$GITHUB_REF" in refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}" ;; esac
          ZIP="dist/minimalhome-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "$TAG is already released: nothing to do"
              exit 0
            fi
            gh release upload "$TAG" "$ZIP" dist/latest.json --clobber
          else
            # the CHANGELOG section for this version, without its heading
            awk -v v="$VERSION" '
              index($0, "## " v) == 1 { on = 1; print substr($0, 4) > "title.txt"; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            TITLE="$(cat title.txt 2>/dev/null || echo "$VERSION")"
            gh release create "$TAG" "$ZIP" dist/latest.json --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file notes.md --latest
          fi
