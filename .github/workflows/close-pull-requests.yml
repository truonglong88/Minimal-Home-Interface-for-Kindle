name: Close pull requests

# This project doesn't take contributions (see CONTRIBUTING.md): close new pull
# requests with a short note. Forks are welcome.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close with a note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks! This project doesn't accept pull requests (see CONTRIBUTING.md). For bugs and ideas, please use Discussions: https://github.com/truonglong88/Minimal-Home-Interface-for-Kindle/discussions. You're welcome to fork it and change it under the AGPL-3.0 license."
